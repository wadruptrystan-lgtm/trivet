.shop-slot.is-next .shop-sstate{padding:0 7px;background:var(--cta);color:var(--cta-ink)}
.shop-slot.is-locked .shop-sicon{opacity:.38;filter:grayscale(.5)}
.shop-slot.is-locked b{opacity:.78}
.shop-frplus .smallbtn{min-height:40px}
.shop-slot.is-locked .shop-sstate{color:var(--faint)}
.shop-frstat{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:12px 4px 0;font-size:13px;font-variant-numeric:tabular-nums}
.shop-frstat b{font-weight:700}
.shop-frstat span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.panel .shop-mystery{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:12px}
.shop-mo{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;background:var(--surface-2);color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.shop-mo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rc)}
@container (max-height:700px){
  .shop-pstage{padding:10px 8px}
  .shop-perks{--k:.84}
  .shop-ptitle{margin-top:10px;font-size:27px}
  .shop-pbtn{margin-top:12px;min-height:46px}
}

/* ================= arcade: Prize Wheel and Lucky Reels ================= */
.arc-page{position:relative;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-top:2px}
.arc-page>*{position:relative}
.arc-glow::before{content:"";position:absolute;left:0;right:0;top:50%;aspect-ratio:1;transform:translateY(-50%);background:radial-gradient(closest-side,rgba(255,179,122,.2),rgba(179,134,255,.08) 58%,transparent);pointer-events:none}
.arc-glow>*{position:relative}
.arc-fill{flex:1}
.arc-fill.top{flex:.7}
/* The header pill plus help button can outgrow a third of a narrow phone; keep the title clear of them. */
.sub.arc-wheel .sub-top,.sub.arc-reels .sub-top{grid-template-columns:minmax(40px,1fr) auto minmax(max-content,1fr)}
.arc-dot{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:#FF4F5E;box-shadow:0 0 0 2.5px var(--cta)}
.arc-big{position:relative;min-height:58px;border-radius:20px;font-size:17px;gap:10px;padding:0 14px}
.arc-big svg{flex:none}
.arc-big[aria-disabled="true"]{cursor:default}
.arc-big[aria-disabled="true"]:active{transform:none}

/* ---------- wheel ---------- */
.arc-wstage{flex:1;display:grid;place-items:center;padding:8px 0 2px}
.arc-rwrap{display:flex;flex-direction:column;gap:12px}
.arc-wheelbox{position:relative;width:min(84cqw,340px,calc(100cqh - 318px));aspect-ratio:1}
.arc-wheelbox::before{content:"";position:absolute;inset:4%;border-radius:50%;box-shadow:0 28px 46px -12px rgba(0,0,0,.7),0 0 70px rgba(255,179,122,.08)}
.arc-wheelbox>svg{position:relative;display:block;width:100%;height:100%;overflow:visible}
.arc-wedge{fill:var(--surface)}
.arc-wedge.alt{fill:var(--surface-2)}
.arc-sep{stroke:#fff;stroke-opacity:.08;stroke-width:1}
.arc-wlabel{font:800 12.5px var(--f-ui);fill:var(--text);letter-spacing:.01em;font-variant-numeric:lining-nums}
.arc-wheelbox .arc-hit{fill:var(--cta);fill-opacity:0;stroke:var(--cta);stroke-opacity:0;stroke-width:2.2;stroke-linejoin:round}
.arc-wheelbox.is-hit .arc-hit{fill-opacity:.2;stroke-opacity:.9}
.arc-hub{fill:var(--bg)}
.arc-hubring{fill:none;stroke:var(--cta);stroke-width:2.4}
.arc-hubdot{fill:var(--cta)}
.arc-ptr{fill:#fff;stroke:#fff;stroke-width:6;stroke-linejoin:round}
.arc-light{fill:#FFE3C4;opacity:.38}
.arc-light:nth-child(odd){opacity:.75}
.arc-pity{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:22px}
.arc-pchest{display:grid;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.arc-meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.arc-meter i{display:block;height:100%;min-width:0;border-radius:inherit;background:linear-gradient(90deg,var(--heat-soft),var(--heat-warm));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.arc-note{margin-top:9px;font:600 13px/1.35 var(--f-ui);color:var(--muted);text-wrap:pretty}
.arc-note b{color:var(--text);font-weight:800}
.arc-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.arc-btns.is-busy .arc-big,.arc-spin.is-busy{background:var(--surface-2);color:var(--muted)}
.arc-btns.is-busy .arc-big .cur,.arc-spin.is-busy .cur{opacity:.6}
.arc-free.arc-wait{background:var(--surface);color:var(--muted)}
.arc-free.arc-wait svg{color:var(--faint)}
.arc-bl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;line-height:1;min-width:0}
.arc-bl small{font:700 12px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.arc-n{font:800 25px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:lining-nums}
.arc-paid .cur{filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}

/* ---------- reels ---------- */
.arc-rstage{--arc-cell:clamp(46px,min(calc((100cqw - 108px) / 3 * .8),calc((100cqh - 446px) / 3)),84px);--ink:#251C2B;overflow:hidden;border-radius:30px;padding:14px 14px 12px;color:var(--ink);background:linear-gradient(158deg,#FFD9C2 0%,#F6D4E2 46%,#DCCDF4 100%);box-shadow:0 24px 50px -24px rgba(255,160,140,.35)}
.arc-rstage::before{content:"";position:absolute;right:-64px;top:-78px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.34);pointer-events:none}
.arc-rstage::after{content:"";position:absolute;left:-40px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);pointer-events:none}
.arc-rstage>*{position:relative;z-index:1}
.arc-cab{border-radius:24px;padding:9px 10px 10px;background:linear-gradient(180deg,#3E3049,#231B2A);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 -4px 0 rgba(0,0,0,.32),0 16px 26px -12px rgba(60,26,70,.55)}
.arc-bulbs{display:flex;justify-content:space-between;padding:0 14px 8px}
.arc-bulbs i{width:7px;height:7px;border-radius:50%;background:#FFE3C4;opacity:.5;box-shadow:0 0 6px rgba(255,179,122,.55)}
.arc-bulbs i:nth-child(odd){opacity:.9}
.arc-window{position:relative;padding:8px 9px;border-radius:18px;background:#141016;box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
.arc-reelrow{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.arc-reel{position:relative;height:calc(var(--arc-cell) * 3);overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#EADFD3,#FFF9F2 30%,#FFF9F2 70%,#EADFD3)}
.arc-reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(37,28,43,.34),transparent 32%,transparent 68%,rgba(37,28,43,.34));pointer-events:none}
.arc-strip{display:flex;flex-direction:column}
.arc-cell{flex:none;height:var(--arc-cell);display:grid;place-items:center}
.arc-sym{width:calc(var(--arc-cell) * .74);aspect-ratio:1;border-radius:30%;display:grid;place-items:center;background:var(--sb);box-shadow:inset 0 -3px 0 rgba(37,28,43,.1),inset 0 1.5px 0 rgba(255,255,255,.75),0 2px 4px rgba(37,28,43,.12)}
.arc-sym svg{width:66%;height:66%}
.arc-cell.arc-won .arc-sym{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--cta),0 4px 12px rgba(226,86,60,.45)}
.arc-line{position:absolute;left:-5px;right:-5px;top:var(--arc-cell);height:var(--arc-cell);border-radius:14px;background:rgba(255,179,122,.07);box-shadow:0 0 0 2px rgba(255,179,122,.9),0 0 18px rgba(255,179,122,.3);pointer-events:none}
.arc-arrow{position:absolute;top:50%;width:0;height:0;border-block:7px solid transparent;transform:translateY(-50%)}
.arc-arrow.l{left:0;border-left:7px solid var(--cta)}
.arc-arrow.r{right:0;border-right:7px solid var(--cta)}
.arc-pity2{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:11px;font:700 13px/1.2 var(--f-ui);color:color-mix(in oklab,var(--ink) 74%,transparent);font-variant-numeric:tabular-nums}
.arc-pity2 b{color:var(--ink);font-weight:800}
.arc-pips{display:flex;gap:5px}
.arc-pips i{width:10px;height:10px;border-radius:50%;background:rgba(37,28,43,.16)}
.arc-pips i.on{background:#E2563C}
.arc-result{min-height:30px;display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;column-gap:6px;text-align:center;font:700 15px/1.2 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.arc-result b{font:800 22px/1.15 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em;color:var(--text)}
.arc-result.is-idle{font-size:14px;align-items:center}
.arc-result.is-triple b{color:var(--heat-soft)}
.arc-result.is-triple span,.arc-result.is-pair span{color:var(--text)}
.arc-result.is-none b{color:var(--muted)}
.arc-claim{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:22px;min-height:66px}
.arc-ci{display:grid;place-items:center;width:40px;height:40px}
.arc-clock{border-radius:50%;background:var(--surface-2);color:var(--muted)}
.arc-ct{display:block;font:800 15px/1.25 var(--f-ui);font-variant-numeric:tabular-nums}
.arc-cs{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.arc-claim:not(.is-ready) .arc-ct{color:var(--muted)}
.arc-claimbtn{position:relative;min-height:40px;padding:0 18px}
.arc-claimbtn .arc-dot{top:-3px;right:-3px;box-shadow:0 0 0 2.5px var(--surface)}
.arc-spin{justify-content:center}
.arc-cost{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 6px;border-radius:99px;background:rgba(42,20,10,.12);font:800 15px/1 var(--f-ui)}

/* ---------- coin burst & swapped header pill ---------- */
.arc-burst{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.arc-coin{position:absolute;left:-13px;top:-13px;width:26px;height:26px;display:grid;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.sub-right .cpill.arc-away{display:none}

/* ---------- help sheets ---------- */
.arc-odds{display:grid;margin-top:12px;padding:4px 14px;border-radius:20px;background:var(--surface-2)}
.arc-odds>div{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;font-size:14px}
.arc-odds>div+div{border-top:1px solid var(--line)}
.arc-odds b{font-weight:700}
.arc-odds em{font:800 16px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-style:normal;color:var(--heat-warm);font-variant-numeric:tabular-nums}
.arc-oi{display:grid}
.arc-pay{display:grid;margin-top:12px;padding:4px 14px;border-radius:20px;background:var(--surface-2)}
.arc-pay>div{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;font-size:14px}
.arc-pay>div+div{border-top:1px solid var(--line)}
.arc-pay .hd{font:700 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 0 8px}
.arc-psym{display:flex;align-items:center;gap:10px;min-width:0}
.arc-psym .arc-sym{width:30px;flex:none;border-radius:10px;box-shadow:inset 0 -2px 0 rgba(37,28,43,.1)}
.arc-psym b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc-amt{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){
  .arc-wheelbox.is-spin .arc-light,.arc-cab.is-spin .arc-bulbs i{animation:arc-twinkle .44s steps(1) infinite}
  .arc-wheelbox.is-spin .arc-light:nth-child(odd),.arc-cab.is-spin .arc-bulbs i:nth-child(odd){animation-delay:-.22s}
  .arc-wheelbox.is-pulse .arc-hit{animation:arc-pulse 1s ease-in-out both}
  .arc-cell.arc-won .arc-sym{animation:arc-pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .arc-result:is(.is-triple,.is-pair){animation:arc-up .35s cubic-bezier(.2,.9,.3,1.2) both}
}
@keyframes arc-twinkle{0%{opacity:1}50%{opacity:.18}}
@keyframes arc-pulse{0%{fill-opacity:.1}25%,75%{fill-opacity:.55}50%{fill-opacity:.15}100%{fill-opacity:.2}}
@keyframes arc-pop{40%{transform:scale(1.14)}}
@keyframes arc-up{from{transform:translateY(6px);opacity:0}}

/* ================= season pass ================= */
/* --sc is the season's pastel; pastel surfaces carry dark ink */
.ssn-wrap{--ink:#251C2B}

/* Play tab ring */
.ssn-ring{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:color-mix(in oklab,var(--sc) 9%,var(--surface-2));color:var(--text);transition:transform .12s}
.ssn-ring:not(:disabled):active{transform:scale(.94)}
.ssn-ring svg{position:absolute;inset:0;width:100%;height:100%}
.ssn-ring circle{fill:none;stroke-width:3}
.ssn-ring .ssn-trk{stroke:rgba(255,255,255,.1)}
.ssn-ring .ssn-arc{stroke:var(--sc);stroke-linecap:round}
.ssn-ring b{position:relative;font:700 16px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:lining-nums tabular-nums}
.ssn-dot{position:absolute;top:0;right:0;width:11px;height:11px;border-radius:50%;background:#FF4F5E;box-shadow:0 0 0 2.5px var(--bg)}

/* hero */
.ssn-hero{position:relative;overflow:hidden;margin-top:6px;padding:20px 18px 18px;border-radius:30px;background:var(--sc);color:var(--ink)}
.ssn-hero::before{content:"";position:absolute;right:-54px;top:-64px;width:196px;height:196px;border-radius:50%;background:rgba(255,255,255,.42)}
.ssn-hero>*{position:relative}
.ssn-hero>.ssn-art{position:absolute;right:18px;top:16px;font:66px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 8px 10px rgba(60,30,40,.22))}
.ssn-hero .eyebrow{color:color-mix(in oklab,var(--ink) 74%,transparent);max-width:calc(100% - 96px)}
.ssn-hero h2{margin-top:6px;max-width:calc(100% - 92px);font:800 36px/1 var(--f-num);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.02em;text-wrap:balance}
.ssn-hero h2:focus{outline:none}
.ssn-hero h2:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:6px}
.ssn-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;min-height:24px}
.ssn-ends{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--f-ui);color:color-mix(in oklab,var(--ink) 76%,transparent);font-variant-numeric:tabular-nums}
.ssn-pbadge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px 0 8px;border-radius:99px;background:var(--ink);color:var(--sc);font:800 10.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
.ssn-pbadge svg{width:12px;height:12px}
.ssn-prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:16px;padding:12px 16px 14px 12px;border-radius:22px;background:rgba(255,255,255,.5)}
.ssn-tier{display:flex;flex-direction:column;align-items:center;min-width:56px}
.ssn-tier span{font:800 10px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:color-mix(in oklab,var(--ink) 74%,transparent)}
.ssn-tier b{margin-top:3px;font:800 46px/.95 var(--f-num);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.ssn-barbox{min-width:0}
.ssn-barlbl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.ssn-barlbl b{font-weight:800;white-space:nowrap}
.ssn-barlbl span{font-weight:700;color:color-mix(in oklab,var(--ink) 74%,transparent);white-space:nowrap}
.ssn-bar{height:10px;margin-top:9px;border-radius:99px;background:rgba(37,28,43,.13);overflow:hidden}
.ssn-bar i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.ssn-earn{display:flex;align-items:center;gap:7px;margin-top:12px;font:700 13px/1.3 var(--f-ui);color:color-mix(in oklab,var(--ink) 74%,transparent)}

/* premium offer */
.ssn-premcard{margin-top:12px;padding:16px;border-radius:26px;background:radial-gradient(110% 90% at 100% 0,color-mix(in oklab,var(--sc) 15%,transparent),transparent 62%),var(--surface)}
.ssn-ptop{display:flex;align-items:center;gap:12px}
.ssn-crest{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;background:color-mix(in oklab,var(--sc) 20%,var(--surface-2))}
.ssn-crest svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.ssn-ptop h3{font:800 22px/1.1 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em}
.ssn-ptop p{margin-top:3px;font-size:13px;color:var(--muted)}
.ssn-excl{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:18px;background:rgba(0,0,0,.22);font-size:12px;line-height:1.35;color:var(--muted)}
.ssn-extxt{display:flex;flex-direction:column;gap:1px;min-width:0;text-wrap:balance}
.ssn-extxt b{color:var(--text);font-weight:700;font-size:13px}
.ssn-exrow{display:flex;flex:none}
.ssn-ex{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in oklab,var(--rc) 30%,var(--surface-2)),var(--surface-2) 75%);box-shadow:0 0 0 2.5px #16121A,inset 0 0 0 1.5px color-mix(in oklab,var(--rc) 70%,transparent)}
.ssn-ex+.ssn-ex{margin-left:-7px}
.ssn-ex .ava{box-shadow:none}
.ssn-premcard .btn{margin-top:14px}

/* track header: sticks under the title bar while the track scrolls; scroll padding keeps keyboard focus clear of it */
.ssn-screen #sub-views{scroll-padding-block:56px 16px}
.ssn-screen:has(.ssn-all) #sub-views{scroll-padding-top:112px}
.ssn-head{position:sticky;top:-4px;z-index:3;margin:18px -16px 0;padding:10px 16px 8px;background:var(--bg)}
.ssn-head::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.ssn-all{margin-bottom:12px}
.ssn-cols,.ssn-row,.ssn-here{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);column-gap:10px}
.ssn-cols{font:800 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.ssn-cols .ssn-p{display:inline-flex;align-items:center;justify-content:center;gap:5px;color:color-mix(in oklab,var(--sc) 80%,var(--muted))}
.ssn-cols svg{width:13px;height:13px;flex:none}

/* track */
.ssn-track{list-style:none;margin:0;padding:6px 0 0}
.ssn-tile{position:relative;min-width:0;min-height:108px;margin-block:5px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-radius:22px;text-align:center;color:var(--text);scroll-margin-block:8px;
  --tint:transparent;--tbg:var(--surface);background:radial-gradient(80% 62% at 50% 30%,var(--tint),transparent 74%),var(--tbg);transition:transform .12s}
.ssn-tile:not(:disabled):active{transform:scale(.97)}
.ssn-tile.ssn-prem{--tbg:linear-gradient(180deg,color-mix(in oklab,var(--sc) 11%,var(--surface)),var(--surface) 72%)}
.ssn-tile.ssn-rar{--tint:color-mix(in oklab,var(--rc) 22%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--rc) 38%,transparent)}
.ssn-tile.ssn-excl{--tint:color-mix(in oklab,var(--rc) 34%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--rc) 65%,transparent)}
.ssn-ic{display:grid;place-items:center;height:46px}
.ssn-lbl{max-width:100%;font:700 13px/1.2 var(--f-ui);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-wrap:balance}
.ssn-claim{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:99px;background:var(--cta);color:var(--cta-ink);font:800 12px/1 var(--f-ui);letter-spacing:.02em}
.ssn-badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-style:normal}
.ssn-badge svg{width:12px;height:12px}
.ssn-badge.ssn-ok{background:var(--sc);color:var(--ink)}
.ssn-tile.ssn-ready{box-shadow:inset 0 0 0 2px var(--cta),0 0 0 3px color-mix(in oklab,var(--cta) 14%,transparent)}
.ssn-tile.ssn-ready:not(.ssn-rar){--tint:color-mix(in oklab,var(--cta) 24%,transparent)}
.ssn-tile.ssn-claimed>:not(.ssn-badge){opacity:.4}
.ssn-tile.ssn-claimed{box-shadow:none;--tint:transparent}
.ssn-tile.ssn-ahead>.ssn-ic{opacity:.5;filter:saturate(.7)}
.ssn-tile.ssn-ahead>.ssn-lbl,.ssn-tile.ssn-locked>.ssn-lbl{color:var(--muted)}
.ssn-tile.ssn-ahead.ssn-rar,.ssn-tile.ssn-locked.ssn-rar{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--rc) 24%,transparent)}
@media (prefers-reduced-motion:no-preference){
  .ssn-tile.ssn-ready .ssn-claim{animation:ssnnudge 2.4s ease-in-out infinite}
  .ssn-ring .ssn-dot{animation:ssnpop .4s cubic-bezier(.2,1.4,.4,1) both}
}
@keyframes ssnnudge{0%,70%,100%{transform:none}80%{transform:scale(1.08)}90%{transform:scale(.98)}}
@keyframes ssnpop{from{transform:scale(0)}}

/* the line and tier nodes */
.ssn-mid{position:relative;display:grid;place-items:center}
.ssn-mid::before,.ssn-mid::after{content:"";position:absolute;left:calc(50% - 2px);width:4px;background:var(--line)}
.ssn-mid::before{top:0;bottom:50%}
.ssn-mid::after{top:50%;bottom:0}
.ssn-mid.ssn-on::before,.ssn-mid.ssn-on::after,.ssn-here .ssn-mid::before{background:var(--sc)}
.ssn-mid.ssn-first::before,.ssn-mid.ssn-last::after{content:none}
.ssn-node{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font:800 14px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:lining-nums tabular-nums;box-shadow:0 0 0 4px var(--bg)}
.ssn-node.ssn-mile{width:38px;height:38px;font-size:16px}
.ssn-mid.ssn-on .ssn-node{background:var(--sc);color:var(--ink)}
.ssn-node.ssn-cur{box-shadow:0 0 0 4px var(--bg),0 0 0 7px color-mix(in oklab,var(--sc) 45%,transparent)}
.ssn-here{min-height:46px}
.ssn-here>*{grid-row:1}
.ssn-here .ssn-mid{grid-column:2}
.ssn-pin{grid-column:1/-1;justify-self:center;align-self:center;z-index:1;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:99px;background:var(--sc);color:var(--ink);font:800 12.5px/1 var(--f-ui);white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 0 0 4px var(--bg),0 8px 18px rgba(0,0,0,.35)}
.ssn-pin span{font-weight:700;color:color-mix(in oklab,var(--ink) 66%,transparent)}
.ssn-pin span::before{content:"·";margin-right:8px;color:color-mix(in oklab,var(--ink) 40%,transparent)}
.ssn-foot{margin-top:18px;padding-inline:12px;text-align:center;font-size:12px;color:var(--muted);text-wrap:pretty}

/* sheets */
.ssn-sheye{padding-inline:4px;margin-bottom:8px}
.ssn-crestbig{position:relative;width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:var(--sc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.ssn-crestbig>span{font:54px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 6px 8px rgba(60,30,40,.25))}
.ssn-crestbig>i{position:absolute;right:-8px;bottom:-8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#16121A}

/* ================= profile ================= */
.prf-ico{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--pc,var(--surface-2));font:21px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;overflow:hidden}
.prf-ico .chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 var(--rim)}
.prf-chev{display:grid;place-items:center;color:var(--faint)}
.prf-cur{display:inline-grid;vertical-align:-2px}
.prf-na{color:var(--faint)}
.prf-pc small{font-size:.55em;font-weight:700;margin-left:1px;letter-spacing:0}
.prf-bar{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prf-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in oklab,var(--rank,var(--heat-warm)) 55%,white),var(--rank,var(--heat-warm)));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prf-fine{font-size:12.5px;margin-top:12px;color:var(--muted)}

/* ---------- header ---------- */
.prf-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 2px}
.prf-avawrap{position:relative;display:grid;place-items:center}
.prf-ava{position:relative;display:grid;place-items:center;border-radius:50%;isolation:isolate}
.prf-ava .ava{box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 0 0 5px var(--surface),0 18px 36px -12px rgba(0,0,0,.6)}
.prf-ava:focus-visible{outline-offset:8px}
.prf-ava:not(:disabled):active{transform:scale(.97)}
.prf-pen{position:absolute;right:-2px;bottom:2px;z-index:2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);box-shadow:0 0 0 3px var(--bg)}
.prf-head.plus .prf-ava .ava{box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 0 0 4px var(--bg)}
.prf-head.plus .prf-ava::before{content:"";position:absolute;inset:-7px;z-index:-1;border-radius:50%;background:conic-gradient(from 200deg,#FFE9D2,#FFB37A,#FF6A4D,#FF8F70,#FFD9B8,#FFE9D2);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.prf-head.plus .prf-ava::after{content:"";position:absolute;inset:-7px;z-index:-2;border-radius:50%;box-shadow:0 0 30px 4px rgba(255,138,92,.42)}
@media (prefers-reduced-motion:no-preference){.prf-head.plus .prf-ava::before{animation:prf-spin 9s linear infinite}}
@keyframes prf-spin{to{transform:rotate(360deg)}}
.prf-plustag{position:absolute;left:50%;bottom:-13px;z-index:3;transform:translateX(-50%);height:22px;padding:0 10px;border-radius:99px;background:linear-gradient(90deg,#FFD9B8,#FFB37A 55%,#FF8F70);color:var(--cta-ink);font:800 11px/22px var(--f-ui);letter-spacing:.02em;white-space:nowrap;box-shadow:0 0 0 3px var(--bg),0 6px 16px rgba(255,130,90,.35)}
.prf-namerow{display:grid;grid-template-columns:40px minmax(0,auto) 40px;align-items:center;gap:4px;max-width:100%;margin-top:18px}
.prf-head.plus .prf-namerow{margin-top:24px}

.prf-name{font:800 28px/1.1 var(--f-num);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.prf-name.long{font-size:22px}
.prf-name:focus{outline:none}
.prf-edit{background:transparent;color:var(--muted)}
@media (hover:hover){.prf-edit:hover{background:var(--surface-2);color:var(--text)}}
.prf-sub{margin-top:3px;font:600 13px/1.3 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.prf-title{margin-top:1px;max-width:100%;font:800 11.5px/1.3 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#F3C452;overflow-wrap:anywhere}
.prf-title+.prf-sub{margin-top:5px}
/* cabinet level and medal counts: one compact pill under the name */
.prf-cab{display:inline-flex;align-items:center;gap:10px;max-width:100%;min-height:40px;margin-top:10px;padding:0 10px 0 14px;border-radius:99px;background:var(--surface);font:700 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;transition:transform .12s}
.prf-cab:not(:disabled):active{transform:scale(.97)}
.prf-cab>b{font-weight:800;white-space:nowrap}
.prf-cabm{display:inline-flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--line)}
.prf-cabt{display:inline-flex;align-items:center;gap:3px;color:var(--text)}
.prf-cabt.off{color:var(--muted)}
.prf-cabt.off .tr-medal{opacity:.45}
.prf-cab .prf-chev{margin-left:-4px}
@media (hover:hover){.prf-cab:hover{background:var(--surface-2)}}

/* ---------- friends ---------- */
.prf-friends{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-top:22px;padding:8px;border-radius:24px}
.prf-fcount{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:52px;padding:6px 8px 6px 6px;border-radius:18px;text-align:left}
.prf-ftx b{display:block;font:800 18px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums}
.prf-ftx span{display:block;font:600 12px/1.2 var(--f-ui);color:var(--muted);margin-top:3px}
.prf-invite{min-height:52px;padding:0 16px 0 13px;border-radius:18px;font-size:14px;gap:6px}
.prf-invite svg{color:var(--heat-warm)}
@media (hover:hover){.prf-fcount:hover,.prf-mrow:hover{background:rgba(255,255,255,.035)}}

/* ---------- rank card ---------- */
.prf-rank{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:10px;padding:16px;border-radius:26px;text-align:left;background:radial-gradient(110% 100% at 0 0,color-mix(in oklab,var(--rank) 15%,transparent),transparent 62%),var(--surface);transition:transform .12s}
.prf-rank:not(:disabled):active{transform:scale(.985)}
.prf-rtop{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px}
.prf-rtx b{display:block;font:800 21px/1.1 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em}
.prf-rtx>span{display:flex;align-items:center;gap:4px;margin-top:4px;font:600 13px/1.2 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.prf-rfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font:600 12px/1.2 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.prf-mult{color:var(--heat-warm);font-weight:800}

/* ---------- playstyle ---------- */
.prf-style{padding:12px 16px 16px}
.prf-chart{width:100%;max-width:320px;margin:0 auto}
.prf-chart svg{display:block;width:100%;height:auto;overflow:visible}
.prf-grid{fill:none;stroke:var(--line);stroke-width:1}
.prf-edge{fill:none;stroke:color-mix(in oklab,var(--text) 20%,transparent);stroke-width:1.5;stroke-linejoin:round}
.prf-qemo{font:21px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle;dominant-baseline:central}
.prf-qname{font:800 10px/1 var(--f-ui);letter-spacing:.12em;text-anchor:middle;fill:var(--muted)}
.prf-q :not(.prf-qname){opacity:.45}
.prf-q .prf-qname{fill:#B9B0C2}
.prf-q.on :not(.prf-qname){opacity:1}
.prf-q.on .prf-qname{fill:color-mix(in oklab,var(--qc) 70%,white)}
.prf-style.dim .prf-q :not(.prf-qname){opacity:.6}
.prf-lab{font:800 10.5px/1 var(--f-ui);letter-spacing:.14em;fill:var(--muted);text-anchor:middle}
.prf-lab.on{fill:color-mix(in oklab,var(--sc) 70%,white)}
.prf-dline{stroke:color-mix(in oklab,var(--sc) 65%,transparent);stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round}
.prf-style.dim .prf-dline{stroke:var(--faint)}
.prf-dot{transform:translate(var(--tx),var(--ty))}
.prf-core{fill:var(--dc);stroke:#FFF8F1;stroke-width:2.5}
.prf-dot.off .prf-core{stroke:var(--muted);stroke-width:2}
.prf-halo{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .prf-pend{opacity:0}
  .prf-dot.prf-go{animation:prf-dotin .95s cubic-bezier(.2,.9,.25,1.12) both}
  .prf-dline.prf-go{animation:prf-fadein .5s .55s both}
  .prf-dot:not(.off) .prf-halo{animation:prf-halo 2.6s ease-in-out infinite}
}
@keyframes prf-dotin{from{transform:translate(150px,132px) scale(.2);opacity:0}}
@keyframes prf-fadein{from{opacity:0}}
@keyframes prf-halo{50%{transform:scale(1.35);opacity:.55}}
.prf-arch{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:12px;margin-top:8px}
.prf-archemo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:color-mix(in oklab,var(--sc) 20%,var(--surface-2));font:28px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prf-style.dim .prf-archemo{background:var(--surface-2)}
.prf-arch h3{font:800 24px/1.1 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em}
.prf-arch .eyebrow{display:block;margin-top:4px;color:color-mix(in oklab,var(--sc) 62%,var(--text))}
.prf-style.dim .prf-arch .eyebrow{color:var(--muted)}
.prf-blurb{margin-top:10px;font-size:14px;color:var(--muted);text-wrap:pretty}
.prf-shareline{margin-top:14px}
.prf-shareline code{font:600 12.5px/1.2 var(--f-ui);color:var(--muted);padding:12px}
.prf-sharebtn{flex:none;min-height:42px;gap:6px}
.prf-brew{--rank:var(--heat-warm);margin-top:12px}

/* ---------- summary ---------- */
.prf-tile .tv{font-size:30px;font-variant-numeric:tabular-nums lining-nums}
.prf-tile .tv small{font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:0}
.prf-more{margin-top:10px;gap:4px;background:var(--surface)}
.prf-more .prf-chev{color:var(--muted)}

/* ---------- menu ---------- */
.prf-menu{display:grid;margin-top:26px;padding:6px;border-radius:26px;background:var(--surface)}
.prf-mrow{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:62px;padding:8px 10px;border-radius:20px;text-align:left}
.prf-mrow+.prf-mrow::before{content:"";position:absolute;top:0;left:62px;right:14px;height:1px;background:var(--line);opacity:.7}
.prf-mtx{min-width:0}
.prf-mtx b{display:block;font-weight:700}
.prf-mtx span{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prf-mtx em{font-style:normal;font-weight:700;color:var(--heat-soft)}

/* ---------- statistics ---------- */
.prf-seg{position:relative;padding-top:4px}
.prf-segn{margin-left:6px;font:600 11px var(--f-ui);font-variant-numeric:tabular-nums}
.prf-stiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prf-stile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 14px 13px;border-radius:22px;background:var(--surface)}
.prf-slab{font:700 12px/1.2 var(--f-ui);color:var(--muted)}
.prf-sval{font:800 40px/1 var(--f-num);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums;margin-top:2px}
.prf-sval .prf-pc small{font-size:.48em}
.prf-seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:4px}
.prf-seg4 i{height:5px;border-radius:99px;background:var(--surface-2)}
.prf-seg4 i.on{background:var(--bc)}
.prf-sread{font:700 12.5px/1.2 var(--f-ui);color:var(--bc,var(--faint))}
.prf-ring{position:relative;width:var(--rs);max-width:100%;aspect-ratio:1;display:grid;place-items:center;flex:none}
.prf-rsvg,.prf-rsvg svg{position:absolute;inset:0;width:100%;height:100%}
.prf-trk{fill:none;stroke:var(--surface-2);stroke-linecap:round}
.prf-arc{fill:none;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.prf-arc{animation:prf-arc .9s cubic-bezier(.2,.8,.2,1) both}}
@keyframes prf-arc{from{stroke-dasharray:0 var(--c)}}
.prf-rlab{position:relative;display:flex;flex-direction:column;align-items:center;font:800 16px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums lining-nums}
.prf-rlab>small{margin-top:5px;font:600 11px/1 var(--f-ui);color:var(--muted)}
.prf-ring.big .prf-rlab{font-size:32px}
.prf-stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:16px 12px 14px}
.prf-stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center;font:600 12px/1.2 var(--f-ui);color:var(--muted)}
.prf-win{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px;padding:16px 18px}
.prf-dl{margin:0;display:grid}
.prf-dl div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0}
.prf-dl div+div{border-top:1px solid var(--line)}
.prf-dl dt{font-size:13px;color:var(--muted)}
.prf-dl dd{margin:0;font:800 22px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums}
.prf-gifts{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px}
.prf-gtx b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.prf-gtx span{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prf-gnum{font-weight:800;font-size:34px;line-height:1}
.prf-dtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prf-dtile{min-width:0;padding:12px 14px;border-radius:18px;background:var(--surface)}
.prf-dtile>span{display:block;font-size:12px;color:var(--muted)}
.prf-dtile>b{display:block;margin-top:4px;font:800 21px/1.15 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums lining-nums;overflow-wrap:anywhere}
.prf-dtile.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px}
.prf-dtile.wide>b{margin-top:0;font-size:18px}
.prf-empty{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;padding:28px 20px 22px;text-align:center}
.prf-emptyart{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--pc);font:44px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prf-empty h2{margin-top:6px;font:800 24px/1.1 var(--f-num);font-variation-settings:"SOFT" 100}
.prf-empty p{font-size:14px;color:var(--muted);max-width:30ch;text-wrap:pretty}
.prf-empty .btn{margin-top:8px;min-width:180px}
.prf-gloss{display:grid;margin:12px 0 0;padding-inline:4px}
.prf-gloss div{padding:10px 0}
.prf-gloss div+div{border-top:1px solid var(--line)}
.prf-gloss dt{font-weight:700;font-size:14px}
.prf-gloss dd{margin:2px 0 0;font-size:13px;color:var(--muted);text-wrap:pretty}

/* ---------- sheets ---------- */
.prf-sheetart{width:60px;height:60px;margin:0 4px 12px;border-radius:50%;display:grid;place-items:center;background:#CFE0FA;font:30px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prf-codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 12px 12px 16px;border-radius:18px;background:var(--surface-2)}
.prf-codetx{display:grid;gap:6px;min-width:0}
.prf-codebox code{font:800 24px/1 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:.06em;color:var(--text);user-select:all;-webkit-user-select:all}
.prf-copy{flex:none;gap:6px;min-height:40px;background:var(--surface)}
.prf-form{margin-top:16px}
.prf-lbl{display:flex;justify-content:space-between;gap:10px;margin:0 4px 8px;font:700 11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prf-left{letter-spacing:0;font-variant-numeric:tabular-nums}
.prf-input{display:block;width:100%;height:54px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--text);font:700 18px/1 var(--f-ui);outline:none;transition:border-color .2s,box-shadow .2s}
.prf-input:focus{border-color:var(--heat-soft);box-shadow:0 0 0 3px rgba(255,217,184,.16)}
.prf-input[aria-invalid="true"]{border-color:var(--heat-hot);box-shadow:0 0 0 3px rgba(255,106,77,.16)}
.panel .prf-err{min-height:18px;margin-top:8px;font:600 13px/1.35 var(--f-ui);color:#FF9A85}
.panel .prf-err:empty{min-height:0;margin-top:0}
.panel .prf-rule{margin-top:6px;font-size:12.5px}
.prf-buyeye{padding-inline:4px;margin-bottom:8px}
.prf-buyh .prf-gp{display:inline-grid;vertical-align:-3px;margin:0 3px 0 1px}
.prf-buyart{display:grid;place-items:center;height:132px;margin:14px 0 4px;border-radius:24px;background:radial-gradient(closest-side,color-mix(in oklab,var(--rc) 30%,transparent),transparent),var(--surface-2)}
.prf-buyart .ava{box-shadow:0 0 0 4px color-mix(in oklab,var(--rc) 55%,transparent),0 12px 24px rgba(0,0,0,.4)}
.prf-bigemo{font:72px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.panel .prf-have{font-size:13px;font-variant-numeric:tabular-nums}
.prf-have .prf-gp{display:inline-grid;vertical-align:-3px;margin:0 2px}
.btn .prf-gp{display:grid}

/* ---------- rank sheet ---------- */
.prf-pager{position:relative;display:flex;gap:10px;overflow-x:auto;margin:14px -18px 0;padding:4px 18px 6px;scroll-padding-inline:18px;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.prf-pager::-webkit-scrollbar{display:none}
.prf-pager:focus-visible{outline-offset:-3px;border-radius:26px}
.prf-rpage{flex:0 0 calc(100% - 22px);scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px 16px 10px;border-radius:24px;background:var(--surface-2)}
.prf-rpage.cur{background:radial-gradient(100% 70% at 0 0,color-mix(in oklab,var(--rank) 17%,transparent),transparent 70%),var(--surface-2);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--rank) 55%,transparent)}
.prf-rphead{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:14px}
.prf-rpbadge{position:relative;display:grid}
.prf-rpage.locked .rbadge{filter:saturate(.35) brightness(.72)}
.prf-rplock{position:absolute;right:-4px;bottom:-2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.prf-rphead h4{margin:0;font:800 25px/1.05 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em}
.prf-rpmin{display:block;margin-top:3px;font:600 12.5px/1.2 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.prf-rstate{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;white-space:nowrap;border-radius:99px;background:rgba(255,255,255,.06);font:800 10px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#C9C1D2}
.prf-rstate.cur{background:color-mix(in oklab,var(--rank) 22%,transparent);color:color-mix(in oklab,var(--rank) 65%,white)}
.prf-rstate.got{color:var(--heat-soft)}
.prf-rpmeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px}
.prf-rpmult{display:inline-flex;align-items:baseline;gap:5px;font:600 13px/1.2 var(--f-ui);color:var(--muted);white-space:nowrap}
.prf-rpmult b{font:800 20px/1 var(--f-num);font-variation-settings:"SOFT" 100;color:var(--heat-warm)}
.prf-rpprog{display:grid;gap:7px;font:600 12px/1.25 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.prf-payh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-top:2px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.prf-payh .eyebrow{white-space:nowrap}
.prf-payh small{font:600 11.5px/1.2 var(--f-ui);color:var(--muted);white-space:nowrap}
.prf-pay{list-style:none;margin:-4px 0 0;padding:0;display:grid}
.prf-pay li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:34px;font:600 13.5px/1.2 var(--f-ui)}
.prf-pay li+li{border-top:1px solid rgba(255,255,255,.05)}
.prf-medal{display:grid}
.prf-amt{display:inline-flex;align-items:center;gap:5px;font:800 15px/1 var(--f-num);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums}
.prf-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.prf-dots i{width:6px;height:6px;border-radius:99px;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.prf-dots i.me{background:color-mix(in oklab,var(--heat-warm) 55%,var(--line))}
.prf-dots i.on{width:18px;background:var(--muted)}

/* ---------- avatar screen ---------- */
.prf-avprev{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px;padding:20px 16px 16px;border-radius:30px;text-align:center;background:radial-gradient(80% 75% at 50% 0,color-mix(in oklab,var(--rc) 22%,transparent),transparent 72%),var(--surface)}
.prf-avbig{display:grid}
.prf-avbig .ava{box-shadow:0 0 0 4px color-mix(in oklab,var(--rc) 55%,transparent),0 16px 30px rgba(0,0,0,.45)}
.prf-avprev.s-lock .prf-avbig .ava{filter:grayscale(.75) brightness(.8)}
.prf-avprev h2{margin-top:10px;font:800 26px/1.1 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em}
.prf-avmeta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:flex-start;gap:6px 10px;min-height:52px}
.prf-avst{display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1.3 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.prf-avprev.s-on .prf-avst{color:var(--heat-soft)}
.prf-avprev.s-buy .prf-avst{color:var(--text)}
.prf-avprev+.prf-seg{margin-top:14px}
.prf-agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
.prf-acell{position:relative;display:flex;flex-direction:column;align-items:center;gap:13px;min-width:0;padding:12px 2px 10px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,transform .12s}
.prf-acell:not(:disabled):active{transform:scale(.96)}
.prf-acell.sel{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--text) 22%,transparent)}
.prf-acell.s-on{background:color-mix(in oklab,var(--heat-warm) 9%,var(--surface));box-shadow:inset 0 0 0 2px var(--heat-soft)}
.prf-aface{position:relative;display:grid}
.prf-acell.s-lock .ava{filter:grayscale(.8) brightness(.72)}
.prf-check,.prf-lock{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface)}
.prf-check{background:var(--heat-soft);color:var(--cta-ink)}
.prf-lock{background:var(--surface-2);color:var(--muted)}
.prf-price{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 5px;border-radius:99px;background:var(--surface-2);box-shadow:0 0 0 2px var(--surface);font:800 11.5px/1 var(--f-ui);color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.prf-price .cur{width:13px;height:13px}
.prf-aname{max-width:100%;padding-inline:4px;font:700 11.5px/1.2 var(--f-ui);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prf-acell.s-on .prf-aname{color:var(--heat-soft)}
.prf-foot{text-align:center;margin-top:16px}
.prf-totr{display:flex;margin:10px auto 0;gap:6px;min-height:40px}

/* ---------- emotes screen ---------- */
.prf-sec1{margin-top:12px}
.prf-slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.prf-slot{position:relative;aspect-ratio:1;min-height:44px;border-radius:16px;display:grid;place-items:center;background:var(--surface);font:26px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s,transform .12s}
.prf-slot:not(:disabled):active{transform:scale(.94)}
.prf-slot i{position:absolute;left:6px;top:5px;font:800 10px/1 var(--f-ui);font-style:normal;color:var(--muted)}
.prf-slot.on{background:color-mix(in oklab,var(--heat-warm) 14%,var(--surface));box-shadow:inset 0 0 0 2px var(--heat-warm)}
.prf-slot.on i{color:var(--heat-warm)}
.prf-hint{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;margin:12px 2px 0;font-size:13px;line-height:1.4;color:var(--muted)}
.prf-hint svg{margin-top:1px;color:var(--heat-warm)}
.prf-egrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
.prf-ecell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;padding:14px 2px 10px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px transparent;transition:transform .12s}
.prf-ecell:not(:disabled):active{transform:scale(.96)}
.prf-eemo{font:34px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prf-ename{max-width:100%;padding-inline:4px;font:700 11.5px/1.2 var(--f-ui);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prf-ecell.s-set{background:color-mix(in oklab,var(--heat-warm) 8%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--heat-soft) 70%,transparent)}
.prf-ecell:is(.s-set,.s-own) .prf-ename{color:var(--text)}
.prf-eslot{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--heat-soft);color:var(--cta-ink);font:800 11px/1 var(--f-ui)}
.prf-ecell .prf-lock{right:6px;top:6px;box-shadow:none}
.prf-ecell.s-lock .prf-eemo{filter:grayscale(1);opacity:.45}
.prf-ecell .prf-price{position:static;transform:none;box-shadow:none}

.prf-seg button{height:40px}
@container (max-height:700px){
  .prf-pager{margin-top:10px}
  .prf-rpage{gap:9px;padding-top:12px}
  .prf-rphead h4{font-size:22px}
  .prf-payh{padding-top:9px}
  .prf-pay li{min-height:30px}
  .prf-dots{margin-top:8px}
}

/* ================= trophies (prefix tr) ================= */
/* ---------- medals ---------- */
.tr-medal{position:relative;display:inline-grid;flex:none;width:var(--ms,40px);height:calc(var(--ms,40px) * 1.1)}
.tr-medal svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 calc(var(--ms,40px) * .05) calc(var(--ms,40px) * .08) rgba(0,0,0,.35))}
.tr-medal.off svg{filter:saturate(.35) brightness(.6)}
/* platinum: a cool sheen that sweeps the disc (disc box: 12.5% 2.3% 75% 70.5% of the medal) */
.tr-medal.t-platinum:not(.off)::after{content:"";position:absolute;left:11.25%;top:3.4%;width:77.5%;height:70.45%;border-radius:50%;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.75) 46%,rgba(214,232,255,.35) 52%,transparent 64%) 30% 0/260% 100% no-repeat;mix-blend-mode:screen}
@media (prefers-reduced-motion:no-preference){.tr-medal.t-platinum:not(.off)::after{animation:tr-sheen 3.6s 1s ease-in-out infinite}}
@keyframes tr-sheen{0%{background-position:120% 0}55%,100%{background-position:-60% 0}}

/* your own avatar once the Platinum is earned: a thin metal ring inside the edge, so the layout never moves */
.ava.tr-plat{--trw:clamp(2px,calc(var(--as,44px) * .055),5px);background:radial-gradient(closest-side,var(--ab,#F3E6D3) calc(100% - var(--trw)),transparent calc(100% - var(--trw) + .8px)),conic-gradient(from 200deg,#FFFFFF,#AEBBCB,#EEF3F9,#8796AD,#DCE6F0,#B9CBE6,#FFFFFF)}

/* ---------- banner ---------- */
.tr-bn{position:absolute;left:0;right:0;top:0;z-index:52;display:flex;justify-content:center;padding:8px 12px 0;pointer-events:none}
.tr-bn *{pointer-events:none}
.tr-bn-card{--tc:#C8875A;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;width:min(100%,380px);min-height:60px;padding:8px 16px 8px 12px;border-radius:22px;
  background:radial-gradient(90% 140% at 0 50%,color-mix(in oklab,var(--tc) 24%,transparent),transparent 60%),color-mix(in oklab,var(--surface-2) 88%,black);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--tc) 42%,transparent),0 18px 36px -8px rgba(0,0,0,.7);opacity:0;visibility:hidden;transform:translateY(calc(-100% - 16px))}
.tr-bn.show .tr-bn-card{opacity:1;visibility:visible;transform:translateY(var(--tr-bn-y,0px))}
@media (prefers-reduced-motion:no-preference){
  .tr-bn-card{transition:transform .45s cubic-bezier(.2,.9,.3,1.12),opacity .3s,visibility 0s .45s}
  .tr-bn.show .tr-bn-card{transition:transform .45s cubic-bezier(.2,.9,.3,1.12),opacity .2s,visibility 0s}
  .tr-bn.show .tr-medal{animation:tr-pop .5s .12s cubic-bezier(.2,1.4,.4,1) both}
}
@keyframes tr-pop{from{transform:scale(.4) rotate(-14deg);opacity:0}}
.tr-bn-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tr-bn-eye{font:800 10.5px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in oklab,var(--tc) 62%,white)}
.tr-bn-tx b{font:800 18px/1.12 var(--f-num);font-variation-settings:"SOFT" 100;letter-spacing:-.01em;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-bn-tier{font:700 12px/1 var(--f-ui);color:var(--muted)}

/* ---------- the Platinum ceremony ---------- */
.tr-cer{display:grid;place-items:center;overflow:hidden;background:radial-gradient(70% 52% at 50% 40%,#3A4458 0,#191A24 48%,#0B0A0F 82%);animation:fade .35s}
.tr-cer-rays{position:absolute;inset:0;pointer-events:none}
.tr-cer-rays i{position:absolute;left:50%;top:38%;width:calc(var(--i) * 96px + 120px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(214,228,245,calc(.34 - var(--i) * .05));transform:translate(-50%,-50%)}
.tr-cer-rays i:nth-child(odd){border-style:dashed}
.tr-cer-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:360px;padding:0 28px;text-align:center}
.tr-cer-medal{display:grid;place-items:center;margin-bottom:10px;filter:drop-shadow(0 0 34px rgba(200,220,255,.35))}
.tr-cer .eyebrow{color:#C9D6E6}
.tr-cer h2{font:800 40px/1.05 var(--f-num);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.02em;background:linear-gradient(180deg,#FFFFFF,#C7D3E2);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr-cer p{color:#B8B4C4;font-size:15px;max-width:28ch;text-wrap:pretty}
.tr-cer-btn{margin-top:18px;min-width:min(240px,100%);min-height:54px;font-size:16px}
@media (prefers-reduced-motion:no-preference){
  .tr-cer-medal{animation:tr-arrive 1.1s cubic-bezier(.2,.9,.25,1.05) both}
  .tr-cer-stage>:not(.tr-cer-medal){animation:rvup .5s both}
  .tr-cer-stage>:nth-child(2){animation-delay:.55s}
  .tr-cer-stage>:nth-child(3){animation-delay:.65s}
  .tr-cer-stage>:nth-child(4){animation-delay:.75s}
  .tr-cer-stage>:nth-child(5){animation-delay:.9s}
  .tr-cer-rays i{animation:tr-ripple 4.5s calc(var(--i) * .35s) ease-in-out infinite}
}
@keyframes tr-arrive{0%{transform:translateY(-60px) scale(.35) rotate(-20deg);opacity:0}60%{transform:translateY(6px) scale(1.06) rotate(3deg);opacity:1}100%{transform:none}}
@keyframes tr-ripple{50%{transform:translate(-50%,-50%) scale(1.06);opacity:.5}}
@container (max-height:700px){
  .tr-cer-medal .tr-medal{--ms:128px!important}
  .tr-cer h2{font-size:34px}
}

/* ---------- results card ---------- */
.tr-res{margin-top:12px}
.tr-reshead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tr-reshead h2.eyebrow{margin:0}
.tr-reshead span{font:600 12.5px/1.2 var(--f-ui);color:var(--muted)}
.tr-reslist{list-style:none;margin:10px 0 0;padding:0;display:grid}
.tr-reslist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:46px;padding:4px 0}
.tr-reslist li+li{border-top:1px solid var(--line)}
.tr-reslist b{font-weight:700;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.tr-reslist span{font:700 12px/1 var(--f-ui);color:var(--muted);white-space:nowrap}
.tr-rsee{margin-top:12px;min-height:46px;gap:8px}
.tr-rsee svg{color:var(--heat-warm)}

/* ---------- cabinet: header ---------- */
.tr-head{display:flex;flex-direction:column;gap:16px;margin-top:6px;padding:18px 18px 10px;border-radius:30px;background:radial-gradient(90% 70% at 0 0,rgba(214,228,245,.09),transparent 65%),var(--surface)}
.tr-htop{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px}
.tr-ring{position:relative;width:108px;height:108px;display:grid;place-items:center;border-radius:50%}
.tr-ring:not(:disabled):active{transform:scale(.97)}
.tr-ringsvg,.tr-ringsvg svg{position:absolute;inset:0;width:100%;height:100%}
.tr-rtrk{fill:none;stroke:var(--surface-2);stroke-width:7}
.tr-rarc{fill:none;stroke:#DCE6F0;stroke-width:7;stroke-linecap:round}
.tr-rarc.tr-rglow{stroke:rgba(214,228,245,.16);stroke-width:13}
@media (prefers-reduced-motion:no-preference){.tr-rarc.tr-arcin{animation:tr-arc 1s cubic-bezier(.2,.8,.2,1) both}}
@keyframes tr-arc{from{stroke-dasharray:0 var(--c)}}
.tr-ring .tr-medal{margin-top:4px}
.tr-hbig{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px}
.tr-hbig b{font:800 44px/1 var(--f-num);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums}
.tr-hbig span{font:700 17px/1 var(--f-num);font-variation-settings:"SOFT" 100;color:var(--muted)}
.tr-htx p{margin-top:6px;font:600 13px/1.35 var(--f-ui);color:#C9D2DE;text-wrap:balance}
.tr-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tr-tierc{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:44px;border-radius:16px;background:var(--surface-2);font:600 13px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.tr-tierc b{font:800 17px/1 var(--f-num);font-variation-settings:"SOFT" 100;color:var(--text)}
.tr-lvl{display:grid;gap:8px}
.tr-lvlrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tr-lvlrow b{font-weight:700;font-size:14px}
.tr-lvlrow span{font:600 12px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.tr-bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.tr-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--heat-soft),var(--heat-warm))}
.tr-lvl .tr-bar i{background:linear-gradient(90deg,#F2F6FA,#AFC0D6)}
.tr-titlebtn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:52px;margin:0 -8px;padding:0 8px;border-top:1px solid var(--line);border-radius:0 0 18px 18px;text-align:left}
.tr-tlab{font:700 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.tr-chev{display:grid;color:var(--faint)}
@media (hover:hover){.tr-row:hover,.tr-titlebtn:hover{background:rgba(255,255,255,.035)}}

/* ---------- cabinet: filter, shelves and rows ---------- */
.tr-seg{margin-top:24px;margin-bottom:-6px}
.tr-seg button{flex:1 1 0;min-width:0;height:40px}
.tr-shelf .sec{margin-top:26px}
.tr-note{margin:-4px 2px 10px;font-size:12.5px;color:var(--muted);text-wrap:pretty}
.tr-shitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:8px;padding:8px 14px 8px 10px;border-radius:18px;background:color-mix(in oklab,var(--surface) 55%,transparent);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--muted)}
.tr-shitem b{color:var(--text);font-weight:700}
.tr-shico{display:grid;place-items:center;width:30px;height:30px}
.tr-shst{display:grid;color:var(--faint)}
.tr-shitem.on{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--heat-soft) 45%,transparent);background:color-mix(in oklab,var(--heat-warm) 7%,var(--surface))}

.tr-list{display:grid;padding:6px;border-radius:26px;background:var(--surface)}
.tr-row{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:start;gap:12px;min-height:64px;padding:12px 10px 12px 8px;border-radius:20px;text-align:left}
.tr-row+.tr-row::before{content:"";position:absolute;top:0;left:60px;right:12px;height:1px;background:var(--line);opacity:.7}
.tr-row:not(:disabled):active{transform:scale(.99)}
.tr-row .tr-medal{margin-top:1px}
.tr-rtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tr-rname{display:flex;align-items:center;gap:8px;min-width:0}
.tr-rname b{font-weight:700;font-size:15px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tr-row:not(.on) .tr-rname b{color:#DCD4E2}
.tr-new{flex:none;height:18px;padding:0 7px;border-radius:99px;background:var(--cta);color:var(--cta-ink);font:800 9.5px/18px var(--f-ui);font-style:normal;letter-spacing:.1em;text-transform:uppercase}
.tr-rdesc{font-size:12.5px;line-height:1.35;color:var(--muted);text-wrap:pretty}
.tr-prog{display:flex;align-items:center;gap:10px;margin-top:5px}
.tr-prog .tr-bar{flex:1;min-width:40px}
.tr-pnum{flex:none;font:700 11.5px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.tr-rew{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:5px;font:700 12px/1.2 var(--f-ui);color:#CFC7D8;font-variant-numeric:tabular-nums}

.tr-when{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font:700 12px/1.2 var(--f-ui);color:var(--heat-soft)}
.tr-empty{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px;padding:26px 20px;text-align:center}

.tr-empty p{font-size:14px;color:var(--muted)}

/* ---------- sheets ---------- */
.tr-dart{display:grid;place-items:center;height:132px;margin:0 0 14px;border-radius:24px;background:radial-gradient(closest-side,color-mix(in oklab,var(--tc) 26%,transparent),transparent),var(--surface-2)}
.tr-deye{padding-inline:4px;margin-bottom:6px}
.panel p.tr-drule{color:var(--text);font-size:15px}
.tr-hintbtn{margin:12px 4px 0;gap:6px;background:var(--surface-2);min-height:40px}
.tr-hintbtn svg{color:var(--heat-warm)}
.panel p.tr-hint{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,179,122,.1);box-shadow:inset 0 0 0 1px rgba(255,179,122,.28);color:var(--text);font-size:14px}

.tr-hint:focus-visible{outline:2px solid var(--heat-soft);outline-offset:2px}
.tr-dprog{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin:14px 4px 0;font:700 13px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.tr-dprog .tr-bar{height:8px}
.tr-drew{margin-top:18px;padding-inline:4px}
.tr-drew .eyebrow{margin-bottom:8px}
.tr-rewl{gap:8px;margin-top:0}
.tr-rewl+.tr-rewl{margin-top:8px}
.tr-rewl .tr-rc{min-height:36px;padding:0 12px 0 8px;border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--text)}
.tr-rewl .tr-rtitle{gap:7px;padding-left:14px}
.tr-rtitle small{font:700 10px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tr-rtitle b{font:italic 800 14px/1 var(--f-num);font-variation-settings:"SOFT" 100}
.tr-ringdot{width:18px;height:18px;border-radius:50%;background:radial-gradient(closest-side,var(--surface-2) 62%,transparent 66%),conic-gradient(from 200deg,#FFFFFF,#AEBBCB,#EEF3F9,#8796AD,#DCE6F0,#FFFFFF)}
.panel p.tr-fine,.tr-fine{font-size:12.5px;color:var(--muted);margin-top:10px}
.panel .tr-drew p.tr-fine{padding-inline:0}
.panel p.tr-last{color:var(--heat-soft)}
.panel p.tr-dwhen{display:flex;align-items:center;gap:6px;margin-top:14px;color:var(--heat-soft);font-weight:700;font-size:13.5px}

.tr-topt{display:grid;grid-template-columns:30px minmax(0,1fr) 24px;align-items:center;gap:12px;min-height:54px;padding:6px 12px 6px 10px;border-radius:18px;background:var(--surface-2);text-align:left;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}

.tr-tnone{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--faint);font-weight:800}
.tr-ttx{min-width:0}
.tr-ttx b{display:block;font:800 16px/1.2 var(--f-num);font-variation-settings:"SOFT" 100}
.tr-ttx span{display:block;margin-top:2px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-tck{display:grid;color:var(--heat-soft)}
.tr-wart{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:2px 0 14px}
.tr-wart .tr-medal:not(:nth-child(2)){margin-bottom:4px}
.tr-wfacts div:nth-child(2){grid-column:auto;order:0}
.tr-howtiers{display:grid;gap:4px;margin-top:16px}
.tr-howt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--surface-2)}

<body>
<div id="stage">
  <div class="field" aria-hidden="true">
    <svg viewBox="0 0 400 400"><circle cx="200" cy="180" r="140" fill="none" stroke="#fff" stroke-width="3"/><circle cx="120" cy="360" r="9" fill="#fff"/><circle cx="200" cy="372" r="9" fill="#fff"/><circle cx="280" cy="360" r="9" fill="#fff"/></svg>
    <svg class="ring2" viewBox="0 0 400 400"><circle cx="200" cy="180" r="140" fill="none" stroke="#fff" stroke-width="4"/><circle cx="120" cy="360" r="10" fill="#fff"/><circle cx="200" cy="372" r="10" fill="#fff"/><circle cx="280" cy="360" r="10" fill="#fff"/></svg>
  </div>
  <div class="field-mark" aria-hidden="true"><b>trivet</b><span>Simple. Modern. Scoop.</span></div>
  <main id="app" class="table-aubergine glaze-porcelain num-fraunces tray-slate">
    <section id="home" class="screen">
      <div id="views" class="views"></div>
      <nav class="tabs" aria-label="Sections">
        <button data-tab="shop"></button>
        <button data-tab="play"></button>
        <button data-tab="league"></button>
        <button data-tab="profile"></button>
      </nav>
    </section>

    <section id="sub" class="screen sub" hidden aria-labelledby="sub-title">
      <header class="t-top sub-top">
        <button class="iconbtn" id="sub-back" aria-label="Back" aria-describedby="sub-title"></button>
        <div class="t-title"><h1 id="sub-title"></h1></div>
        <div class="sub-right" id="sub-right"></div>
      </header>
      <div class="views" id="sub-views"></div>
    </section>

    <section id="table" class="screen" hidden aria-label="Table">
      <header class="t-top">
        <button class="iconbtn" id="t-back" aria-label="Leave match"></button>
        <div class="t-title"><b id="t-venue"></b><span id="t-hand"></span></div>
        <button class="iconbtn" id="t-menu" aria-label="Table settings"></button>
      </header>
      <div class="opps" id="t-opps"></div>
      <div class="infostrip">
        <div class="bag" id="t-bag"></div>
        <button class="unseen" id="t-unseen" aria-label="Unseen chips by number"></button>
      </div>
      <div class="trays" id="t-trays"></div>
      <div class="glance" id="t-glance"></div>
      <div class="hand" id="t-hand-chips" aria-label="Your chips"></div>
      <div class="actions" id="t-actions"></div>
      <div class="mefoot" id="t-me"></div>
    </section>

    <section id="result" class="screen" hidden>
      <div class="views" id="r-views"></div>
    </section>

    <section id="recap" class="screen" hidden>
      <header class="t-top">
        <button class="iconbtn" id="rc-back" aria-label="Back to results"></button>
        <div class="t-title"><b>What they held</b><span id="rc-sub"></span></div>
        <span></span>
      </header>
      <div class="views" id="rc-views" style="padding-bottom:32px"></div>
    </section>

    <div id="t-log" class="sr-only" role="log" aria-live="polite"></div>
    <div id="sheet" class="sheet" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script>
/*
 * Scoop — rules engine + AI for "trivet".
 * Plain ES2015 JavaScript. No dependencies, no Node APIs: drop it into a <script> tag
 * (it defines a global `Scoop`) or require() it from Node.
 *
 * ---------------------------------------------------------------------------------
 * STATE      A plain JSON-serialisable object made by newMatch(). Hidden information
 *            (every player's hand) lives in state.hands[pid]; the UI must only ever
 *            render state.hands[humanPid] and use handSizes for everyone else.
 * MUTATION   applyAction(state, action) returns a NEW state and never touches its input.
 *            applyAction(state, action, {inPlace:true}) mutates and returns the same
 *            object (simulations use this for speed). Every other function is pure.
 * RANDOMNESS state.rng (uint32, mulberry32) is advanced only by the engine's own shuffles
 *            (seat order, starting player, bag). AI noise, AI memory and WIN% rollouts are
 *            seeded from hash(state.seed, state.ply, pid, …) unless an rng function is
 *            passed in, so the same state + same personality always gives the same move.
 * ---------------------------------------------------------------------------------
 * Trays between turns never hold a trio, so no tray ever has 3 copies of a number.
 * Internally (AI, rollouts) a tray is therefore just two bitmasks:
 *   P = numbers present at least once, D = numbers present twice.   (bit v = number v)
 */
var Scoop = (function () {
  'use strict';

  // ------------------------------------------------------------------ rules / tables
  var DEFAULT_RULES = {
    values: 8,          // chips are numbered 1..values
    copiesSmall: 5,     // copies of each number at 2-3 players (40 chips)
    copiesLarge: 6,     // copies of each number at 4 players (48 chips)
    largeFrom: 4,       // player count from which copiesLarge is used
    copies: 0,          // >0 forces a copy count (variants)
    trays: 3,
    cap: 6,             // a tray reaching this many chips without a trio boils over
    handSize: 3,
    hands: 3,           // hands per match
    seedCount: 2,       // chips seeded into each tray at hand start (0, 1 or 2)
    refillCount: 2,     // chips seeded into an emptied tray (0, 1 or 2)
    seedGap: 3,         // the 2nd seed chip must differ from the 1st by at least this
    seatShuffle: true,  // re-randomise turn order before every hand
    starter: 'trailing', // hands 2+: 'trailing' (lowest total) | 'random' | 'leader' | 'rotate'
    sprungHeat: 0.5,    // [CHANGED vs spec: 0] Sprung needs the fed tray's heat (feeder's view) >= this right after the feed
    finalHandTiebreak: true // [ADDED vs spec] 3rd tiebreak before sharing a place: more points in the final hand
  };

  // Venue sharpness (tau = Gumbel noise, eps = random-move chance, memory = recall of gone chips)
  var VENUES = {
    cafe:       { key: 'cafe', name: 'Corner Café', seats: 2, unlock: 1, tau: 1.4, eps: 0.15, memory: 0.4,
                  entry: 100, prizes: [200], xpMult: 1.0, rivals: ['rico', 'priya'], aids: 'full', reward: 'Café Enamel' },
    noodle:     { key: 'noodle', name: 'Noodle Bar', seats: 3, unlock: 3, tau: 0.9, eps: 0.07, memory: 0.6,
                  entry: 300, prizes: [600, 300], xpMult: 1.25, rivals: ['priya', 'mabel', 'otto'], aids: 'full-longpress', reward: 'Lacquer' },
    tea:        { key: 'tea', name: 'The Tea House', seats: 2, unlock: 6, tau: 0.5, eps: 0.03, memory: 0.8,
                  entry: 1000, prizes: [2000], xpMult: 1.5, rivals: ['mabel', 'otto', 'june'], aids: 'colour', reward: 'Celadon' },
    // [CHANGED vs spec 0.25 / 0.01 / 0.95] so a good player breaks even here (sim: 1st 23%, EV ~0)
    supper:     { key: 'supper', name: 'Supper Club', seats: 4, unlock: 10, tau: 0.4, eps: 0.02, memory: 0.9,
                  entry: 4000, prizes: [10000, 5000, 1000], xpMult: 2.0, rivals: ['mabel', 'otto', 'june', 'sol'], aids: 'colour', reward: 'Copper' },
    glasshouse: { key: 'glasshouse', name: 'The Glasshouse', seats: 4, unlock: 15, tau: 0.08, eps: 0, memory: 1.0,
                  entry: 15000, prizes: [37500, 18750, 3750], xpMult: 2.5, rivals: ['sol', 'june', 'otto'], aids: 'colour', timer: 20, reward: 'Glass' }
  };

  // Personality styles. lambda = risk aversion, mu = setup (trap) weight, beta = boil-over bonus,
  // kappa = keep-4s-and-5s weight, big = feed-the-fattest-tray weight.
  var PERSONALITIES = {
    rico:  { name: 'Rico',  title: 'The Hothead',   lambda: 0.3, mu: 0,   beta: -3, kappa: 0,   big: 0.35, line: 'Hot tray, hot hands.' },
    priya: { name: 'Priya', title: 'Quick Hands',   lambda: 0.8, mu: 0.1, beta: 0,  kappa: 0,   big: 0, memCap: 0.6, line: 'Mine. Next!' },
    mabel: { name: 'Mabel', title: 'The Hoarder',   lambda: 0.8, mu: 0.6, beta: 0,  kappa: 3,   big: 0, line: "I'll hold onto that, dear." },
    otto:  { name: 'Otto',  title: 'The Spoiler',   lambda: 0.9, mu: 0.2, beta: 4,  kappa: 0,   big: 0, spiteAt: ['glasshouse'], line: 'Nobody gets that one.' },
    june:  { name: 'June',  title: 'The Counter',   lambda: 1.3, mu: 0.2, beta: 0,  kappa: 0.5, big: 0, memFixed: 1.0, hardAt: ['glasshouse'], line: "There's one 6 left. It isn't yours." },
    sol:   { name: 'Sol',   title: 'The Trapper',   lambda: 1.0, mu: 0.8, beta: 0,  kappa: 1,   big: 0, slowplay: true, hardAt: ['supper', 'glasshouse'], line: 'Go on. Feed it.' },
    // baselines (not shown in the app)
    random:   { name: 'Random', random: true },
    greedy:   { name: 'Greedy', greedy: true },     // scoop the biggest tray if possible, else random
    rollout:  { name: 'Rollout', rolloutPolicy: true }, // the fast WIN% rollout policy
    // model of "a sensible human" used when a hard-tier AI simulates the human's reply
    sensible: { name: 'Sensible', lambda: 1.0, mu: 0.3, beta: 0, kappa: 0.5, big: 0 }
  };

  var SIGMA = { 2: 6.5, 3: 5.5, 4: 5.2 }; // per-remaining-hand noise for WIN%
  // seatWeights [CHANGED vs spec: all 1]: weight on each opponent's gain by seat distance (next, 2nd, 3rd).
  // Equal weights made the hard tier feed the seat right after it (+3.3 pts/hand for that seat at 4 seats).
  var HARD = { samples: 120, budgetMs: 60, minSamples: 30, passWeight: 0.15, leaderWeight: 1.2, setupWeight: 0.5,
               seatWeights: { 2: [1], 3: [1, 1], 4: [2, 1, 0.6] } };
  // [CHANGED vs spec] WIN% rollouts are table-aware by default: AI seats play their own style at venue sharpness,
  // your seat plays this "decent player" profile (plain fast-policy rollouts read 14-18 pts low against Café rivals).
  var SELF_PROFILE = { name: 'self', lambda: 1.0, mu: 0.3, beta: 0, kappa: 0.5, big: 0, tau: 0.3, eps: 0.02 };

  // ------------------------------------------------------------------ utilities
  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  function mix32(s) {
    var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function nextRand(st) { var s = (st.rng + 0x6D2B79F5) >>> 0; st.rng = s; return mix32(s); }
  /** makeRng(seed) -> function returning floats in [0,1) (mulberry32). */
  function makeRng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; return mix32(s); }; }
  function hash32() {
    var h = 0x9E3779B9 | 0;
    for (var i = 0; i < arguments.length; i++) {
      h = Math.imul(h ^ (arguments[i] | 0), 0x85EBCA6B); h ^= h >>> 13;
      h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    }
    return h >>> 0;
  }
  function shuffle(a, r) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function pc(x) { x = x - ((x >> 1) & 0x55555555); x = (x & 0x33333333) + ((x >> 2) & 0x33333333); return (((x + (x >> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24; }
  function fullMask(V) { return (1 << (V + 1)) - 2; }

    porcelain: { amp: .45, att: .004, dec: .32, parts: [[2, 'sine', 1], [5.43, 'sine', .22]] },
    marimba: { amp: .6, att: .006, dec: .55, parts: [[1, 'sine', 1], [3.93, 'sine', .28]] },
    musicbox: { amp: .38, att: .003, dec: .95, parts: [[2, 'triangle', .8], [4, 'sine', .28], [6.02, 'sine', .08]] },
    glassharp: { amp: .32, att: .07, dec: 1.25, parts: [[2, 'sine', 1], [3, 'sine', .18]] },

    trio(vals) {

      if (g !== M.gen) return;
      await perform(a, g);
      if (g !== M.gen) return;
      if (M.mode === 'tutorial') { await lessonDone(g); return; }
    } else {

      const oc = Scoop.moveOutcome(st, a.chip, a.tray);

/* trophies. Moments are judged when the engine resolves a move and earned as the scoop or boil shows (txTrFire);

// The trophy API lives in another module; a fault there must never stall a match or lose its booking.
function txTrCall(f, ...a) { try { return f(...a); } catch (e) { console.error(e); } }

function txTrScan(prev, next) {

  const due = (ev, id) => { if (!T.tr[id]) { T.tr[id] = 1; T.due.push({ ev, id }); } };
  const by = [], ended = next.events.some(e => e.type === 'handEnd'), glass = M.mode === 'venue' && M.vk === 'glasshouse';
  for (const ev of next.events) {
    if (ev.type === 'play') by[ev.tray] = T.fed[ev.tray]; // who fed it last before this chip
    else if (ev.type === 'scoop') {
      const f = by[ev.tray], count = v => ev.chips.filter(c => c === v).length;
      if (ev.pid !== 0) { if (f === 0) { T.giftsBy[prev.handNo] = (T.giftsBy[prev.handNo] || 0) + 1; if (ev.points >= 6) due(ev, 'generous'); } continue; }
      if (ev.double && ++T.doubles === 3) due(ev, 'double');
      if (ev.sprung && ++T.sprung === 4) due(ev, 'trapper');

      if (f > 0 && next.players[f].personality === 'sol' && Scoop.completers(prev.trays[ev.tray], prev.rules.values).some(v => prev.hands[f].includes(v)) && ++T.steals === 2) due(ev, 'turnabout');
      if (glass && prev.ply !== T.autoPly && M.timeLeft <= 2) due(ev, 'nerve');
      if (count(1) >= 3) T.lo = true;

/* ================= arcade: Prize Wheel and Lucky Reels ================= */
// Grant first, animate second: a spin picks its outcome, charges, applies and saves before anything moves,
// so leaving or reloading mid-spin never loses or repeats a prize. The wheel angle and the reel faces live in
// module state, so a re-render keeps what is on screen; o.refresh updates counters without rebuilding either.
function wheelFreeReady() { return S.arcade.wheelFreeDay !== dayKey(); }
function reelsClaimReady() { return Date.now() >= (S.arcade.reelsClaimAt || 0); }

const arcPick = (list, r = Math.random) => { let x = r() * list.reduce((a, o) => a + o.w, 0); for (const o of list) if ((x -= o.w) < 0) return o; return list[list.length - 1]; };
const arcMidnight = () => { const d = new Date(); d.setHours(24, 0, 0, 0); return +d; };
// cubic-bezier(x1, y1, x2, y2) as a function of linear progress, solved by bisection.
function arcBezier(x1, y1, x2, y2) {
  const c = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 26; i++) { if (c(x1, x2, t) < x) lo = t; else hi = t; t = (lo + hi) / 2; } return c(y1, y2, t); };
}
// Re-run sync when a countdown to `at` next changes its minute.
